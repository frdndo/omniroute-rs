[package]
name = "omniroute-rs"
version = "0.2.0"
description = "Smart AI provider router — desktop shell"
edition = "2021"

# Tauri v2. This crate is intentionally NOT part of the rust-core workspace:
# it can only compile where webkit2gtk/wkwebview toolchains exist (macOS).
[lib]
name = "omniroute_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[features]
# This feature is used for production builds where the sidecar binary is
# expected to be bundled next to the app.
custom-protocol = ["tauri/custom-protocol"]
