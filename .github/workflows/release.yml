name: release

# Auto version bump + tag + GitHub Release setiap merge ke master.
# Rules (lihat .github/scripts/bump-version.py): feat → minor, lainnya → patch.
# Idempotent — NOOP kalau versi sudah di-tag / commit terakhir release.
# Jalankan validasi yang sama dengan ci.yml (fmt/clippy/build/test)
# SEBELUM bump — release cuma terjadi kalau semua check hijau.

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.lock') }}

      - name: Check fmt
        run: cargo fmt --all --check
        working-directory: rust-core

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust-core

      - name: Build
        run: cargo build --release
        working-directory: rust-core

      - name: Test
        run: cargo test
        working-directory: rust-core

      - name: Audit
        run: |
          command -v cargo-audit || cargo install cargo-audit --locked
          cargo audit
        working-directory: rust-core

  bump-tag-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: bump
        run: |
          OUT=$(python3 .github/scripts/bump-version.py)
          echo "$OUT"
          if echo "$OUT" | grep -q "^NOOP"; then
            echo "noop=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$OUT" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + tag
        if: steps.bump.outputs.noop != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin master
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: GitHub Release
        if: steps.bump.outputs.noop != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes