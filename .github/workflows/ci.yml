name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.lock') }}

      - name: Check fmt
        run: cargo fmt --all --check
        working-directory: rust-core

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust-core

      - name: Build
        run: cargo build --release
        working-directory: rust-core

      - name: Test
        run: cargo test
        working-directory: rust-core

      - name: Audit
        run: cargo audit
        continue-on-error: true
        working-directory: rust-core

  napi-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install napi-rs
        run: npm install -g @napi-rs/cli
        working-directory: rust-core/omniroute-core

      - name: Build N-API
        run: napi build --platform --release
        working-directory: rust-core/omniroute-core

      - name: Upload N-API artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-core-node
          path: rust-core/omniroute-core/*.node
