name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-core/Cargo.lock') }}

      - name: Check fmt
        run: cargo fmt --all --check
        working-directory: rust-core

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: rust-core

      - name: Build
        run: cargo build --release
        working-directory: rust-core

      - name: Test
        run: cargo test
        working-directory: rust-core

      # cargo-audit run directly — the rustsec/audit-check action still uses
      # deprecated Node 20. ~/.cargo/bin is cached so install is a no-op on
      # cache hits.
      - name: Audit
        run: |
          command -v cargo-audit || cargo install cargo-audit --locked
          cargo audit
        working-directory: rust-core

  napi-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install napi-rs
        run: npm install -g @napi-rs/cli
        working-directory: rust-core/omniroute-core

      - name: Build N-API
        run: napi build --platform --release
        working-directory: rust-core/omniroute-core

      - name: Upload N-API artifact
        uses: actions/upload-artifact@v7
        with:
          name: omniroute-core-node
          path: rust-core/omniroute-core/*.node